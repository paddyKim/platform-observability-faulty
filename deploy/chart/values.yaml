replicaCount: 1

image:
  repository: ghcr.io/paddykim/platform-observability-faulty
  tag: main
  pullPolicy: Always

applicationName: platform-observability-faulty
failureDelaySeconds: "1.25"

service:
  port: 8000

monitoring:
  enabled: true
  labels:
    release: monitoring
  scrapeInterval: 15s
  errorRateThreshold: 0.2
  p95LatencySeconds: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi
