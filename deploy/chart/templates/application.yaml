apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "demo.name" . }}
    application: {{ .Values.applicationName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "demo.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "demo.name" . }}
        application: {{ .Values.applicationName }}
    spec:
      containers:
        - name: app
          image: {{ include "demo.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APPLICATION_NAME
              value: {{ .Values.applicationName | quote }}
            - name: FAILURE_DELAY_SECONDS
              value: {{ .Values.failureDelaySeconds | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "demo.name" . }}
    application: {{ .Values.applicationName }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "demo.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
