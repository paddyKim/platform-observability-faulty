[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-observability-faulty"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "prometheus-client>=0.22,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faulty_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
